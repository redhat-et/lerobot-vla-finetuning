apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: download-model-and-dataset
  annotations:
    description: >-
      Downloads a Hugging Face model repo into pvc-base-models and a
      Hugging Face dataset repo (optionally just one subfolder of it) into
      pvc-datasets. Repo IDs are the "owner/name" form used by huggingface.co
      URLs, e.g. the dataset at https://huggingface.co/datasets/lerobot/libero
      has repo id "lerobot/libero".
    tags: lerobot-vla,data-download

objects:
  - apiVersion: batch/v1
    kind: Job
    metadata:
      # generateName (not a fixed name): this Template is meant to be
      # processed once per model/dataset combination, so a fixed name would
      # collide with `oc apply` on the second run ("field is immutable").
      # Kubernetes appends a unique random suffix on every create -- no
      # extra scripting needed to keep names unique across runs.
      generateName: download-model-and-dataset-
      labels:
        app.kubernetes.io/name: lerobot-vla
        app.kubernetes.io/part-of: vla-finetuning
        app.kubernetes.io/component: data-download
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400

      template:
        metadata:
          labels:
            app.kubernetes.io/name: lerobot-vla
            app.kubernetes.io/part-of: vla-finetuning
            app.kubernetes.io/component: data-download

        spec:
          restartPolicy: Never

          nodeSelector:
            topology.kubernetes.io/zone: us-east-1b

          securityContext:
            seccompProfile:
              type: RuntimeDefault

          containers:
            - name: downloader
              image: registry.access.redhat.com/ubi9/python-312:latest
              imagePullPolicy: IfNotPresent

              env:
                - name: HOME
                  value: /tmp/home

                - name: HF_HOME
                  value: /workspace/cache/huggingface

                - name: HF_HUB_DISABLE_TELEMETRY
                  value: "1"

                # This dataset has 50k+ small files. Xet fetches a signed
                # "xet-read-token" per file/group through a separate Rust-side
                # code path (hf_xet) that does NOT go through huggingface_hub's
                # Python-level RateLimit-aware retry logic. With this many files
                # it blows through the much smaller "API" rate-limit bucket and
                # crashes with an unhandled 429 -- see
                # https://github.com/huggingface/huggingface_hub/issues/4520 and
                # https://github.com/huggingface/huggingface_hub/issues/2936 for
                # the same failure mode on sibling nvidia/PhysicalAI-* datasets.
                # Falling back to classic resolver downloads avoids that endpoint
                # entirely and uses the much higher resolver quota instead, where
                # huggingface_hub's built-in 429 retry-after handling does apply.
                # Harmless (just slightly slower) for repos small enough that
                # this failure mode would never trigger anyway.
                - name: HF_HUB_DISABLE_XET
                  value: "1"

                # Default is 10s. On slow/high-latency links this causes spurious
                # ReadTimeout retries that themselves eat into the rate-limit
                # window. Give resolver requests more headroom.
                - name: HF_HUB_DOWNLOAD_TIMEOUT
                  value: "60"

                # --- Parameterized: repo id is the "owner/name" form from
                # the huggingface.co URL, e.g. the model at
                # https://huggingface.co/lerobot/pi05_base has repo id
                # "lerobot/pi05_base". MODEL_DIR is derived from it below,
                # not passed separately, so the two can't drift out of sync.
                - name: MODEL_REPO_ID
                  value: "${MODEL_REPO_ID}"

                # Repo id of the dataset, e.g. for
                # https://huggingface.co/datasets/lerobot/libero this is
                # "lerobot/libero".
                - name: DATASET_REPO_ID
                  value: "${DATASET_REPO_ID}"

                # Optional. Only needed for a dataset repo that bundles many
                # unrelated sub-datasets under one repo id and you want just
                # one of them (e.g. nvidia/PhysicalAI-Robotics-Manipulation-
                # SingleArm's "panda-stack-platforms" subfolder). Leave empty
                # to download the dataset repo's entire contents -- this is
                # the right default for most lerobot/* dataset repos
                # (including lerobot/libero), which are not subdivided.
                - name: DATASET_SUBDIR
                  value: "${DATASET_SUBDIR}"

                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: huggingface-credentials
                      key: token
                      optional: false

              command:
                - /bin/bash
                - -lc

              args:
                - |
                  set -euo pipefail

                  if [[ -z "${MODEL_REPO_ID}" ]]; then
                    echo "MODEL_REPO_ID is empty -- pass -p MODEL_REPO_ID=owner/name" >&2
                    exit 1
                  fi
                  if [[ -z "${DATASET_REPO_ID}" ]]; then
                    echo "DATASET_REPO_ID is empty -- pass -p DATASET_REPO_ID=owner/name" >&2
                    exit 1
                  fi

                  # Derived, not separately parameterized: mirrors the
                  # repo id's own "owner/name" structure under each PVC's
                  # mount root, so MODEL_DIR/DATASET_ROOT can never drift
                  # out of sync with the repo id that produced them.
                  MODEL_DIR="/workspace/models/${MODEL_REPO_ID}"
                  DATASET_REPO_DIR="/workspace/data/${DATASET_REPO_ID}"
                  if [[ -n "${DATASET_SUBDIR}" ]]; then
                    DATASET_ROOT="${DATASET_REPO_DIR}/${DATASET_SUBDIR}"
                  else
                    DATASET_ROOT="${DATASET_REPO_DIR}"
                  fi

                  echo "MODEL_REPO_ID:    ${MODEL_REPO_ID}"
                  echo "MODEL_DIR:        ${MODEL_DIR}"
                  echo "DATASET_REPO_ID:  ${DATASET_REPO_ID}"
                  echo "DATASET_SUBDIR:   ${DATASET_SUBDIR:-(none -- downloading whole repo)}"
                  echo "DATASET_ROOT:     ${DATASET_ROOT}"

                  PYTHON_PACKAGES_DIR="/tmp/python-packages"

                  export PYTHONPATH="${PYTHON_PACKAGES_DIR}${PYTHONPATH:+:${PYTHONPATH}}"
                  export PATH="${PYTHON_PACKAGES_DIR}/bin:${PATH}"

                  mkdir -p \
                    "${HOME}" \
                    "${HF_HOME}" \
                    "${PYTHON_PACKAGES_DIR}" \
                    "${MODEL_DIR}" \
                    "${DATASET_REPO_DIR}" \
                    "${DATASET_ROOT}"

                  python -m pip install \
                    --disable-pip-version-check \
                    --no-cache-dir \
                    --target="${PYTHON_PACKAGES_DIR}" \
                    "huggingface_hub[hf_xet]>=1.2.0,<2.0"

                  python -c '
                  import huggingface_hub
                  print("huggingface_hub:", huggingface_hub.__version__)
                  '

                  echo "hf CLI: $(command -v hf)"
                  hf --version

                  echo "==> Verifying Hugging Face authentication"

                  if [[ -z "${HF_TOKEN:-}" ]]; then
                    echo "HF_TOKEN is empty" >&2
                    exit 1
                  fi

                  HF_IDENTITY="$(
                    hf auth whoami 2>&1
                  )" || {
                    echo "Hugging Face authentication failed:" >&2
                    echo "${HF_IDENTITY}" >&2
                    exit 1
                  }

                  echo "Hugging Face authentication succeeded"
                  echo "${HF_IDENTITY}"

                  # Retry helper: re-running `hf download` / snapshot_download is
                  # cheap because --local-dir / local_dir already skips files that
                  # are complete and up-to-date, so a retry only fetches what's
                  # still missing. This absorbs a stray 429/connection error
                  # without failing the whole Job (and without relying solely on
                  # the Job's own backoffLimit, whose restarts are much coarser
                  # and re-run this whole script from scratch, including auth).
                  retry() {
                    local attempt=1
                    local max_attempts=6
                    local sleep_seconds=90
                    until "$@"; do
                      if (( attempt >= max_attempts )); then
                        echo "ERROR: command failed after ${attempt} attempts: $*" >&2
                        return 1
                      fi
                      echo "WARNING: attempt ${attempt}/${max_attempts} failed, retrying in ${sleep_seconds}s: $*" >&2
                      sleep "${sleep_seconds}"
                      attempt=$((attempt + 1))
                    done
                  }

                  MODEL_MARKER="${MODEL_DIR}/.download-complete"
                  DATASET_MARKER="${DATASET_ROOT}/.download-complete"

                  if [[ -f "${MODEL_MARKER}" ]]; then
                    echo "==> Model already present: ${MODEL_DIR}"
                  else
                    echo "==> Downloading model: ${MODEL_REPO_ID}"

                    MODEL_DOWNLOAD_SCRIPT="$(mktemp)"
                    cat > "${MODEL_DOWNLOAD_SCRIPT}" <<'PY'
                  import os
                  from huggingface_hub import snapshot_download

                  snapshot_download(
                      repo_id=os.environ["MODEL_REPO_ID"],
                      repo_type="model",
                      local_dir=os.environ["MODEL_DIR"],
                      token=os.environ.get("HF_TOKEN") or None,
                      max_workers=4,
                  )
                  PY

                    MODEL_DIR="${MODEL_DIR}" retry python "${MODEL_DOWNLOAD_SCRIPT}"

                    test -f "${MODEL_DIR}/config.json"
                    touch "${MODEL_MARKER}"
                    echo "==> Model download completed"
                  fi

                  if [[ -f "${DATASET_MARKER}" ]]; then
                    echo "==> Dataset already present: ${DATASET_ROOT}"
                  else
                    echo "==> Downloading dataset with the official Hugging Face CLI"
                    echo "Repository: ${DATASET_REPO_ID}"
                    echo "Subfolder:  ${DATASET_SUBDIR:-(whole repo)}"

                    # Xet is disabled via HF_HUB_DISABLE_XET above, so this uses
                    # the classic resolver download path (see env var comment).
                    # Existing files and local metadata in --local-dir are reused.
                    # --max-workers defaults to 8. With datasets that have many
                    # small files (parquet shards, video clips, etc.), 8 parallel
                    # resolve requests can burst through the 5-minute rate-limit
                    # window and trigger 429s. Lowering it trades a bit of raw
                    # throughput for fewer 429/backoff cycles overall.
                    HF_DOWNLOAD_ARGS=(
                      "${DATASET_REPO_ID}"
                      --repo-type dataset
                      --local-dir "${DATASET_REPO_DIR}"
                      --max-workers 4
                      --token "${HF_TOKEN}"
                    )
                    if [[ -n "${DATASET_SUBDIR}" ]]; then
                      HF_DOWNLOAD_ARGS+=(--include "${DATASET_SUBDIR}/**")
                    fi

                    retry hf download "${HF_DOWNLOAD_ARGS[@]}"

                    test -f "${DATASET_ROOT}/meta/info.json"
                    touch "${DATASET_MARKER}"

                    echo "==> Dataset download completed"
                  fi

                  echo
                  echo "==> Download Job completed successfully"

                  du -sh \
                    "${MODEL_DIR}" \
                    "${DATASET_ROOT}"

              volumeMounts:
                - name: base-models
                  mountPath: /workspace/models

                - name: datasets
                  mountPath: /workspace/data

                - name: download-cache
                  mountPath: /workspace/cache

              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "4"
                  memory: 8Gi

              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true

          volumes:
            - name: base-models
              persistentVolumeClaim:
                claimName: pvc-base-models

            - name: datasets
              persistentVolumeClaim:
                claimName: pvc-datasets

            - name: download-cache
              emptyDir: {}

parameters:
  - name: MODEL_REPO_ID
    displayName: Model repo ID
    description: >-
      Hugging Face model repo id ("owner/name"), e.g. lerobot/pi05_base
      (from https://huggingface.co/lerobot/pi05_base).
    value: lerobot/pi05_base
    required: true

  - name: DATASET_REPO_ID
    displayName: Dataset repo ID
    description: >-
      Hugging Face dataset repo id ("owner/name"), e.g. lerobot/libero
      (from https://huggingface.co/datasets/lerobot/libero).
    required: true

  - name: DATASET_SUBDIR
    displayName: Dataset subfolder (optional)
    description: >-
      Only set this for a dataset repo that bundles multiple sub-datasets
      under one repo id and you want just one subfolder of it (e.g.
      "panda-stack-platforms" for
      nvidia/PhysicalAI-Robotics-Manipulation-SingleArm). Leave empty to
      download the dataset repo's entire contents -- correct for
      lerobot/libero and most other lerobot/* dataset repos.
    value: ""
