apiVersion: batch/v1
kind: Job
metadata:
  name: lerobot-pi05-finetuning
  labels:
    app.kubernetes.io/name: lerobot-vla
    app.kubernetes.io/part-of: vla-finetuning
    app.kubernetes.io/component: training

spec:
  # Do not automatically repeat an expensive failed GPU run.
  backoffLimit: 0

  # Keep the completed Job and logs for seven days.
  # Checkpoints remain on the output PVC after the Job is deleted.
  ttlSecondsAfterFinished: 604800

  template:
    metadata:
      labels:
        app.kubernetes.io/name: lerobot-vla
        app.kubernetes.io/part-of: vla-finetuning
        app.kubernetes.io/component: training

    spec:
      restartPolicy: Never

      # These PVCs use zonal EBS storage. This must match the zone in which
      # the download Job initially provisioned and mounted them.
      #
      # gpu-pool-size=xlarge is this cluster's only currently-scaled GPU
      # pool (checked via `oc get machinesets -n openshift-machine-api`):
      # 3 nodes total, each with 4x NVIDIA L40S (46GB). Pinning to it
      # explicitly (rather than relying on nvidia.com/gpu.present alone)
      # protects against a future gpu-pool/gpu-pool-large pool -- currently
      # scaled to 0 -- being scaled up with a different GPU count per node,
      # which could otherwise silently change how many GPUs this Job's
      # fixed "nvidia.com/gpu" resource request lands on.
      nodeSelector:
        topology.kubernetes.io/zone: us-east-1b
        nvidia.com/gpu.present: "true"
        gpu-pool-size: xlarge

      imagePullSecrets:
        - name: quay-pull-secret

      securityContext:
        # fsGroup: 0 was rejected by restricted-v2/restricted-v3 (group 0 =
        # root, explicitly disallowed). Omit fsGroup entirely and let
        # OpenShift auto-assign a valid GID from the namespace's allowed
        # supplemental-groups range (check with:
        #   oc get project <ns> -o jsonpath='{.metadata.annotations.openshift\.io/sa\.scc\.supplemental-groups}'
        # ). If you need a specific fsGroup for PVC permission reasons, use
        # a value from that range instead of an arbitrary number.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
        # Required by restricted-v3 -- must be explicitly false, not omitted.
        hostUsers: false

      # Dataset preparation is performed before the GPU training container.
      # It uses the same LeRobot image because the conversion scripts must
      # exactly match the installed LeRobot version.
      initContainers:
        - name: dataset-preflight
          image: quay.io/rhn-ee-edushkin/lerobot-vla-finetuning:latest
          imagePullPolicy: Always

          env:
            - name: HOME
              value: /tmp/home

            - name: HF_HOME
              value: /workspace/cache/huggingface

            - name: HF_LEROBOT_HOME
              value: /workspace/cache/lerobot

            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"

            - name: MODEL_DIR
              value: /workspace/models/lerobot/pi05_base

            - name: DATASET_REPO_ID
              value: nvidia/PhysicalAI-Robotics-Manipulation-SingleArm

            - name: DATASET_ROOT
              value: /workspace/data/nvidia/PhysicalAI-Robotics-Manipulation-SingleArm/panda-stack-platforms

            - name: CONVERSION_MARKER
              value: /workspace/data/nvidia/PhysicalAI-Robotics-Manipulation-SingleArm/panda-stack-platforms/.converted-v30

            # Non-video, numeric features that need QUANTILES normalization
            # (see policy.normalization_mapping below: VISUAL uses IDENTITY,
            # which never consults dataset stats at all -- see
            # lerobot/processor/normalize_processor.py). Change this for a
            # future dataset with differently named action/state features;
            # no script edits needed.
            - name: QUANTILE_FEATURES
              value: "action,observation.state"

            # Which physical dataset camera maps to which of the model's
            # camera INPUT SLOTS. The correspondence itself (e.g. "hand_camera
            # is physically the left wrist, not the right") can only be
            # supplied by a human -- but everything else (which slot names
            # actually exist, how many there are, how many are left empty)
            # is derived from ${MODEL_DIR}/config.json below and validated,
            # not hardcoded. See the preflight step "Deriving camera
            # rename_map / empty_cameras from the model config".
            - name: CAMERA_MAP
              value: >-
                {"observation.images.world_camera":"observation.images.base_0_rgb","observation.images.hand_camera":"observation.images.left_wrist_0_rgb"}

            # Written by this init container once camera requirements are
            # validated; read by the trainer container below. Lives on the
            # training-cache volume (mounted read/write in both containers),
            # not on the dataset PVC, since it's pipeline handoff state, not
            # dataset content.
            - name: DERIVED_CAMERA_CONFIG
              value: /workspace/cache/derived_camera_config.json

          command:
            - /bin/bash
            - -lc

          args:
            - |
              set -euo pipefail

              stage() {
                echo ""
                echo "############################################################"
                echo "# STAGE: $1"
                echo "############################################################"
              }

              stage_done() {
                echo "------------------------------------------------------------"
                echo "STAGE DONE: $1"
                echo "------------------------------------------------------------"
              }

              mkdir -p \
                "${HOME}" \
                "${HF_HOME}" \
                "${HF_LEROBOT_HOME}"

              echo "============================================================"
              echo "LeRobot dataset preflight"
              echo "============================================================"

              stage "Checking required commands and Python modules"

              command -v python >/dev/null
              command -v lerobot-train >/dev/null

              python - <<'PY'
              import importlib.util

              required_modules = [
                  "lerobot",
                  "lerobot.scripts.convert_dataset_v21_to_v30",
              ]

              missing = [
                  name
                  for name in required_modules
                  if importlib.util.find_spec(name) is None
              ]

              if missing:
                  raise SystemExit(
                      "Missing required Python modules: " + ", ".join(missing)
                  )

              print("Required LeRobot modules are installed")
              PY

              stage_done "Required commands and Python modules are present"

              stage "Checking mounted base model"

              test -d "${MODEL_DIR}"
              test -f "${MODEL_DIR}/config.json"

              echo "Base model: ${MODEL_DIR}"
              du -sh "${MODEL_DIR}"

              stage_done "Base model is mounted and present"

              stage "Checking mounted dataset"

              test -d "${DATASET_ROOT}"
              test -f "${DATASET_ROOT}/meta/info.json"

              echo "Dataset: ${DATASET_ROOT}"
              du -sh "${DATASET_ROOT}"

              stage_done "Dataset is mounted and present"

              stage "Converting dataset to LeRobot v3.0 (if needed)"

              DATASET_VERSION="$(
                DATASET_ROOT="${DATASET_ROOT}" \
                python - <<'PY'
              import json
              import os
              from pathlib import Path

              info_path = Path(os.environ["DATASET_ROOT"]) / "meta" / "info.json"

              with info_path.open() as stream:
                  info = json.load(stream)

              version = (
                  info.get("codebase_version")
                  or info.get("version")
                  or info.get("dataset_version")
                  or ""
              )

              print(str(version))
              PY
              )"

              echo "Detected dataset version: ${DATASET_VERSION:-unknown}"

              # LeRobot stores codebase_version WITH a leading "v" (e.g.
              # "v2.1", "v3.0"), not a bare number -- strip it before
              # comparing so this check actually matches real values.
              DATASET_VERSION_NORMALIZED="${DATASET_VERSION#v}"

              if [[ "${DATASET_VERSION_NORMALIZED}" == 3.0 || "${DATASET_VERSION_NORMALIZED}" == 3.0.* ]]; then
                echo "Dataset is already v3.0 -- no conversion needed"
                touch "${CONVERSION_MARKER}"
                stage_done "Dataset already in v3.0 format (no transformation performed)"
              else
                echo "Detected version: ${DATASET_VERSION:-unknown} -- converting to v3.0"

                rm -f "${CONVERSION_MARKER}"

                python -m lerobot.scripts.convert_dataset_v21_to_v30 \
                  --repo-id="${DATASET_REPO_ID}" \
                  --root="${DATASET_ROOT}" \
                  --push-to-hub=false

                touch "${CONVERSION_MARKER}"
                stage_done "Dataset transformed to v3.0"
              fi

              stage "Verifying dataset after conversion (version, CAMERA_MAP source keys, action/state features)"

              DATASET_ROOT="${DATASET_ROOT}" \
              CAMERA_MAP="${CAMERA_MAP}" \
              python - <<'PY'
              import json
              import os
              from pathlib import Path

              dataset_root = Path(os.environ["DATASET_ROOT"])
              info_path = dataset_root / "meta" / "info.json"

              with info_path.open() as stream:
                  info = json.load(stream)

              version = str(
                  info.get("codebase_version")
                  or info.get("version")
                  or info.get("dataset_version")
                  or ""
              )

              # Same fix as the bash pre-check above: LeRobot stores this
              # with a leading "v" (e.g. "v3.0"), which never starts with
              # the bare string "3.0" -- strip it before comparing.
              version_normalized = version.lstrip("v")

              if not version_normalized.startswith("3.0"):
                  raise SystemExit(
                      f"Dataset conversion did not produce version 3.0; "
                      f"detected: {version or 'unknown'}"
                  )

              features = info.get("features")

              if not isinstance(features, dict):
                  raise SystemExit(
                      "meta/info.json does not contain a valid 'features' object"
                  )

              camera_map = json.loads(os.environ["CAMERA_MAP"])

              missing = sorted(set(camera_map) - set(features))

              if missing:
                  raise SystemExit(
                      "Dataset is missing camera feature(s) named as CAMERA_MAP "
                      "source keys: " + ", ".join(missing)
                  )

              non_video = sorted(
                  name for name in camera_map if features[name].get("dtype") != "video"
              )
              if non_video:
                  raise SystemExit(
                      "CAMERA_MAP source key(s) exist in the dataset but are not "
                      "video features: " + ", ".join(non_video)
                  )

              collisions = sorted(set(camera_map.values()) & set(features))

              if collisions:
                  raise SystemExit(
                      "Dataset already contains CAMERA_MAP target features, "
                      "which would create ambiguous camera mappings: "
                      + ", ".join(collisions)
                  )

              if "action" not in features:
                  raise SystemExit("Dataset does not contain the 'action' feature")

              if "observation.state" not in features:
                  raise SystemExit(
                      "Dataset does not contain the 'observation.state' feature"
                  )

              print("Dataset version:", version)
              print("CAMERA_MAP source cameras are present in the dataset")
              print("Action and state features are present")
              PY

              stage_done "Dataset verified: v3.0, CAMERA_MAP source cameras present, action/state features present"

              stage "Matching RENAME_MAP and POLICY_EMPTY_CAMERAS against the model config"

              # By NAME and by COUNT: read the model's actual VISUAL input
              # slots from its own downloaded config.json instead of assuming
              # a fixed set/count. CAMERA_MAP's targets must be a subset of
              # what the model really has; the number of slots CAMERA_MAP
              # does not cover becomes --policy.empty_cameras, computed here
              # rather than hardcoded -- so a future base model with a
              # different camera count/naming is caught immediately instead
              # of silently mis-training.
              MODEL_DIR="${MODEL_DIR}" \
              CAMERA_MAP="${CAMERA_MAP}" \
              DATASET_ROOT="${DATASET_ROOT}" \
              DERIVED_CAMERA_CONFIG="${DERIVED_CAMERA_CONFIG}" \
              python - <<'PY'
              import json
              import os
              from pathlib import Path

              model_config_path = Path(os.environ["MODEL_DIR"]) / "config.json"
              with model_config_path.open() as stream:
                  model_config = json.load(stream)

              input_features = model_config.get("input_features")
              if not isinstance(input_features, dict) or not input_features:
                  raise SystemExit(
                      f"{model_config_path} has no usable 'input_features' object"
                  )

              # Preserve declaration order: config.json's own ordering is the
              # model's canonical camera-slot priority (e.g. base view
              # before wrist views), used below to explain unused slots.
              required_cameras = [
                  key
                  for key, spec in input_features.items()
                  if isinstance(spec, dict) and spec.get("type") == "VISUAL"
              ]
              if not required_cameras:
                  raise SystemExit(
                      f"{model_config_path} declares no VISUAL input features -- "
                      "cannot derive camera requirements for this model"
                  )

              camera_map = json.loads(os.environ["CAMERA_MAP"])

              invalid_targets = sorted(set(camera_map.values()) - set(required_cameras))
              if invalid_targets:
                  raise SystemExit(
                      "CAMERA_MAP target(s) are not camera inputs this model "
                      f"actually has ({model_config_path}): " + ", ".join(invalid_targets)
                      + f"\nModel's real VISUAL inputs: {', '.join(required_cameras)}"
                  )

              if len(set(camera_map.values())) != len(camera_map.values()):
                  raise SystemExit(
                      "CAMERA_MAP maps two different dataset cameras onto the same "
                      "model input -- each target must be unique"
                  )

              if len(camera_map) > len(required_cameras):
                  raise SystemExit(
                      f"CAMERA_MAP has {len(camera_map)} entries but the model only "
                      f"has {len(required_cameras)} camera input(s): "
                      + ", ".join(required_cameras)
                  )

              empty_cameras = len(required_cameras) - len(camera_map)
              unused_slots = [c for c in required_cameras if c not in camera_map.values()]

              dataset_root = Path(os.environ["DATASET_ROOT"])
              with (dataset_root / "meta" / "info.json").open() as stream:
                  dataset_features = json.load(stream).get("features", {})
              dataset_cameras = {
                  name for name, spec in dataset_features.items()
                  if isinstance(spec, dict) and spec.get("dtype") == "video"
              }
              unused_dataset_cameras = sorted(dataset_cameras - set(camera_map))
              if unused_dataset_cameras:
                  print(
                      "NOTE: dataset camera(s) not listed in CAMERA_MAP will be "
                      "ignored during training: " + ", ".join(unused_dataset_cameras)
                  )

              print(f"Model requires {len(required_cameras)} camera(s): {', '.join(required_cameras)}")
              print(f"CAMERA_MAP covers {len(camera_map)}; unused model slot(s) (-> empty_cameras): "
                    f"{', '.join(unused_slots) or '(none)'}")
              print(f"RENAME_MAP = {camera_map}")
              print(f"Derived --policy.empty_cameras={empty_cameras}")

              # The pretrained checkpoint's action/state projection layers
              # (e.g. action_in_proj) are fixed-size weight matrices sized
              # for the model's max_action_dim/max_state_dim (32 for
              # pi0/pi05_base). Smaller dataset dims are zero-padded at
              # runtime and work fine; LARGER ones do not fit those
              # weights at all and fail to load with a shape-mismatch
              # error -- a real, confirmed failure mode, see
              # https://github.com/huggingface/lerobot/issues/2963
              # ("size mismatch for model.action_in_proj.weight"). Catch
              # this here, before spending GPU time, instead of at
              # lerobot-train's checkpoint-loading step.
              dim_checks = (
                  ("action", "max_action_dim"),
                  ("observation.state", "max_state_dim"),
              )


              derived = {"rename_map": camera_map, "empty_cameras": empty_cameras}
              out_path = Path(os.environ["DERIVED_CAMERA_CONFIG"])
              out_path.parent.mkdir(parents=True, exist_ok=True)
              out_path.write_text(json.dumps(derived))
              print(f"Wrote {out_path}")
              PY

              stage_done "RENAME_MAP and POLICY_EMPTY_CAMERAS matched and validated against the model config"

              stage "Computing quantile (q01/q99) statistics"

              # IMPORTANT: this must run against the SAME on-cluster dataset
              # copy used for training (DATASET_ROOT, on pvc-datasets) -- a
              # local run of compute_quantile_stats.py on your own machine
              # has NO effect here, since that's a completely separate
              # physical copy of the dataset. Idempotent: skips computation
              # if q01/q99 are already present for every feature listed in
              # QUANTILE_FEATURES.
              HAS_QUANTILES="$(
                DATASET_ROOT="${DATASET_ROOT}" \
                QUANTILE_FEATURES="${QUANTILE_FEATURES}" \
                python - <<'PY'
              import json
              import os
              from pathlib import Path

              info_path = Path(os.environ["DATASET_ROOT"]) / "meta" / "stats.json"
              required = tuple(
                  f.strip() for f in os.environ["QUANTILE_FEATURES"].split(",") if f.strip()
              )

              if not info_path.exists():
                  print("false")
                  raise SystemExit(0)

              with info_path.open() as stream:
                  stats = json.load(stream)

              ok = all(
                  isinstance(stats.get(feature), dict)
                  and "q01" in stats[feature]
                  and "q99" in stats[feature]
                  for feature in required
              )
              print("true" if ok else "false")
              PY
              )"

              if [[ "${HAS_QUANTILES}" == "true" ]]; then
                echo "q01/q99 stats already present, skipping computation"
                stage_done "Quantile stats already present (computation skipped)"
              else
                # Computes stats only for QUANTILE_FEATURES (non-video),
                # reading directly from the parquet shards -- bypasses
                # video decoding entirely. This replaces
                # lerobot.scripts.augment_dataset_quantile_stats, whose
                # official implementation decodes every video frame and
                # falls back to fully sequential per-episode processing
                # whenever video keys are present (no parallelism), which
                # took ~40h ETA on this dataset's 17629 episodes. Since
                # this Job's policy.normalization_mapping uses VISUAL:
                # IDENTITY, video features never need stats in the first
                # place (see lerobot/processor/normalize_processor.py:
                # NormalizationMode.IDENTITY short-circuits before any
                # stats lookup) -- so skipping video here changes nothing
                # about what training actually uses.
                echo "Computing q01/q99 for: ${QUANTILE_FEATURES} (reading parquet directly, no video decoding)"
                python /opt/lerobot-tools/compute_quantile_stats.py \
                  --root="${DATASET_ROOT}" \
                  --features="${QUANTILE_FEATURES}"

                echo "Verifying quantile stats were actually written"
                DATASET_ROOT="${DATASET_ROOT}" \
                QUANTILE_FEATURES="${QUANTILE_FEATURES}" \
                python - <<'PY'
              import json
              import os
              import sys
              from pathlib import Path

              info_path = Path(os.environ["DATASET_ROOT"]) / "meta" / "stats.json"
              required = tuple(
                  f.strip() for f in os.environ["QUANTILE_FEATURES"].split(",") if f.strip()
              )

              with info_path.open() as stream:
                  stats = json.load(stream)

              missing = [
                  feature
                  for feature in required
                  if not (
                      isinstance(stats.get(feature), dict)
                      and "q01" in stats[feature]
                      and "q99" in stats[feature]
                  )
              ]

              if missing:
                  sys.exit(
                      "q01/q99 still missing after running compute_quantile_stats.py "
                      "for: " + ", ".join(missing)
                  )

              print("q01/q99 present for:", ", ".join(required))
              PY
                stage_done "Quantile stats computed and verified"
              fi

              echo ""
              echo "============================================================"
              echo "dataset-preflight completed successfully"
              echo "============================================================"

          volumeMounts:
            # Same mountPath as the download job (/workspace/models) --
            # the model was downloaded with local_dir=MODEL_DIR directly
            # under this mount point, so the on-disk layout relative to the
            # volume root is "lerobot/pi05_base/...". Keep this path in sync
            # with download-job.yaml's base-models mountPath.
            - name: base-models
              mountPath: /workspace/models
              readOnly: true

            # Conversion to v3.0 modifies the dataset in place.
            - name: datasets
              mountPath: /workspace/data

            - name: training-cache
              mountPath: /workspace/cache

          resources:
            requests:
              cpu: "4"
              memory: 16Gi
            limits:
              cpu: "8"
              memory: 32Gi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true

      containers:
        - name: trainer
          image: quay.io/rhn-ee-edushkin/lerobot-vla-finetuning:latest
          imagePullPolicy: Always

          env:
            - name: HOME
              value: /tmp/home

            - name: HF_HOME
              value: /workspace/cache/huggingface

            - name: HF_LEROBOT_HOME
              value: /workspace/cache/lerobot

            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"

            - name: TOKENIZERS_PARALLELISM
              value: "false"

            - name: MODEL_DIR
              value: /workspace/models/lerobot/pi05_base

            # Human-readable identifier for the base model, matching
            # download-job.yaml's MODEL_REPO_ID -- recorded in the
            # fine-tuned model's metadata file, and used to mirror the
            # base model's path under pvc-finetuned-models (see
            # BASE_MODELS_ROOT/MODEL_DIR below).
            - name: MODEL_REPO_ID
              value: lerobot/pi05_base

            # Mount path of the base-models PVC (must match this
            # container's volumeMounts below). MODEL_DIR's path relative
            # to this root ("lerobot/pi05_base") is mirrored under
            # pvc-finetuned-models so the fine-tuned output lives at the
            # same relative location as the base model it came from.
            - name: BASE_MODELS_ROOT
              value: /workspace/models

            # Root of the finetuned-models PVC (mounted below). The
            # actual per-run output directory is computed in-script as
            # "${FINETUNED_MODELS_ROOT}/<model's relative path>/<run
            # timestamp>", not hardcoded here.
            - name: FINETUNED_MODELS_ROOT
              value: /workspace/output

            - name: DATASET_REPO_ID
              value: nvidia/PhysicalAI-Robotics-Manipulation-SingleArm

            - name: DATASET_ROOT
              value: /workspace/data/nvidia/PhysicalAI-Robotics-Manipulation-SingleArm/panda-stack-platforms

            - name: JOB_NAME
              value: pi05-panda-stack-platforms

            - name: TRAINING_STEPS
              value: "20000"

            # Fixed value. lerobot/pi05_libero_base's own model card example
            # uses batch_size=4 for single-run fine-tuning of this same
            # policy family; adjust if you outgrow this GPU's memory.
            - name: BATCH_SIZE
              value: "4"

            - name: NUM_WORKERS
              value: "4"

            # Kubernetes Downward API: automatically reflects THIS
            # container's own resources.limits.nvidia.com/gpu, whatever it
            # is set to above -- not a second hardcoded copy of "4" that
            # could silently drift out of sync if that value ever changes.
            # Used purely as a sanity cross-check against the GPU count
            # PyTorch actually reports at runtime (see "Verifying CUDA and
            # GPU" stage below); they should always agree under normal
            # Kubernetes GPU scheduling, so a mismatch is a genuine signal
            # something is wrong, not routine variation.
            - name: EXPECTED_GPU_COUNT
              value: "4"

            # Written by dataset-preflight (validated against this exact
            # model's config.json): {"rename_map": {...}, "empty_cameras": N}.
            - name: DERIVED_CAMERA_CONFIG
              value: /workspace/cache/derived_camera_config.json

            - name: NORMALIZATION_MAPPING
              value: >-
                {"ACTION":"QUANTILES","STATE":"QUANTILES","VISUAL":"IDENTITY"}

            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-credentials
                  key: token
                  optional: true

          command:
            - /bin/bash
            - -lc

          args:
            - |
              set -euo pipefail

              stage() {
                echo ""
                echo "############################################################"
                echo "# STAGE: $1"
                echo "############################################################"
              }

              stage_done() {
                echo "------------------------------------------------------------"
                echo "STAGE DONE: $1"
                echo "------------------------------------------------------------"
              }

              # Mirror the base model's own path structure under
              # pvc-finetuned-models: MODEL_DIR="/workspace/models/lerobot/pi05_base"
              # with BASE_MODELS_ROOT="/workspace/models" gives
              # MODEL_RELATIVE_PATH="lerobot/pi05_base", so the fine-tuned
              # output root becomes "/workspace/output/lerobot/pi05_base"
              # -- same relative location, different (finetuned-models)
              # storage. Not hardcoded, so changing MODEL_DIR/MODEL_REPO_ID
              # automatically changes where output lands too.
              case "${MODEL_DIR}" in
                "${BASE_MODELS_ROOT}"/*)
                  MODEL_RELATIVE_PATH="${MODEL_DIR#"${BASE_MODELS_ROOT}"/}"
                  ;;
                *)
                  echo "MODEL_DIR (${MODEL_DIR}) is not under BASE_MODELS_ROOT (${BASE_MODELS_ROOT})" >&2
                  exit 1
                  ;;
              esac
              OUTPUT_ROOT="${FINETUNED_MODELS_ROOT}/${MODEL_RELATIVE_PATH}"

              RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)"
              RUN_NAME="${JOB_NAME}-${RUN_ID}"
              RUN_OUTPUT_DIR="${OUTPUT_ROOT}/${RUN_ID}"

              # IMPORTANT: do NOT mkdir RUN_OUTPUT_DIR itself here.
              # lerobot-train's cfg.validate() checks that output_dir does
              # NOT already exist (unless --resume=true is passed) and
              # raises FileExistsError otherwise -- pre-creating it ourselves
              # was exactly what triggered that error. Only create the
              # parent (OUTPUT_ROOT); lerobot-train creates RUN_OUTPUT_DIR
              # itself when it starts.
              mkdir -p \
                "${HOME}" \
                "${HF_HOME}" \
                "${HF_LEROBOT_HOME}" \
                "${OUTPUT_ROOT}"

              echo "Fine-tuned model will be written to: ${RUN_OUTPUT_DIR}"

              echo "============================================================"
              echo "LeRobot π0.5 fine-tuning"
              echo "============================================================"
              echo "Run name: ${RUN_NAME}"
              echo "Output:   ${RUN_OUTPUT_DIR}"

              stage "Final model and dataset checks"

              test -f "${MODEL_DIR}/config.json"
              test -f "${DATASET_ROOT}/meta/info.json"
              test -f "${DATASET_ROOT}/.converted-v30"
              test -f "${DERIVED_CAMERA_CONFIG}"

              stage_done "Model and dataset files are present"

              stage "Loading RENAME_MAP and POLICY_EMPTY_CAMERAS derived by dataset-preflight"

              # Written by dataset-preflight's model-config-driven derivation
              # (see training-job.yaml's initContainers) -- not hardcoded here,
              # so a different base model/dataset combination is reflected
              # automatically instead of silently using stale values.
              RENAME_MAP="$(
                DERIVED_CAMERA_CONFIG="${DERIVED_CAMERA_CONFIG}" \
                python -c '
              import json, os
              with open(os.environ["DERIVED_CAMERA_CONFIG"]) as f:
                  print(json.dumps(json.load(f)["rename_map"]))
              '
              )"
              POLICY_EMPTY_CAMERAS="$(
                DERIVED_CAMERA_CONFIG="${DERIVED_CAMERA_CONFIG}" \
                python -c '
              import json, os
              with open(os.environ["DERIVED_CAMERA_CONFIG"]) as f:
                  print(json.load(f)["empty_cameras"])
              '
              )"
              echo "RENAME_MAP:           ${RENAME_MAP}"
              echo "POLICY_EMPTY_CAMERAS: ${POLICY_EMPTY_CAMERAS}"

              stage_done "RENAME_MAP and POLICY_EMPTY_CAMERAS loaded"

              stage "Checking available disk space"

              # RUN_OUTPUT_DIR doesn't exist yet at this point (see note
              # above), so check space on its parent instead.
              df -h \
                "${DATASET_ROOT}" \
                "${OUTPUT_ROOT}"

              stage_done "Disk space checked"

              stage "Checking LeRobot CLI options"

              TRAIN_HELP="$(lerobot-train --help 2>&1)"

              for REQUIRED_OPTION in \
                "dataset.repo_id" \
                "dataset.root" \
                "policy.path" \
                "policy.empty_cameras" \
                "policy.normalization_mapping" \
                "policy.freeze_vision_encoder" \
                "policy.train_expert_only" \
                "rename_map" \
                "save_checkpoint_to_hub" \
                "policy.push_to_hub"
              do
                if ! grep -Fq "${REQUIRED_OPTION}" <<<"${TRAIN_HELP}"; then
                  echo "Installed lerobot-train does not expose option: ${REQUIRED_OPTION}" >&2
                  exit 1
                fi
              done

              echo "Required lerobot-train options are available"

              stage_done "LeRobot CLI options verified"

              stage "Verifying CUDA and GPU"

              python - <<'PY'
              import importlib.metadata
              import torch

              print("lerobot:", importlib.metadata.version("lerobot"))
              print("torch:", torch.__version__)
              print("wheel CUDA runtime:", torch.version.cuda)
              print("CUDA available:", torch.cuda.is_available())
              print("GPU count:", torch.cuda.device_count())

              if not torch.cuda.is_available():
                  raise SystemExit(
                      "CUDA is not available inside the training Pod"
                  )

              if torch.cuda.device_count() < 1:
                  raise SystemExit("No NVIDIA GPU is visible to PyTorch")

              # Check every visible GPU, not just device 0 -- with multiple
              # GPUs requested, a mixed/heterogeneous node could otherwise
              # slip an unsupported card past this check.
              for device_index in range(torch.cuda.device_count()):
                  name = torch.cuda.get_device_name(device_index)
                  capability = torch.cuda.get_device_capability(device_index)
                  print(f"GPU {device_index}: {name}, compute capability {capability}")

                  if capability < (8, 0):
                      raise SystemExit(
                          f"GPU {device_index} ({name}) has compute capability "
                          f"{capability}, which is not supported by this "
                          "training configuration"
                      )
              PY

              # Read back separately (rather than parsing the diagnostic
              # output above) so this stays a single, unambiguous value.
              GPU_COUNT="$(python -c 'import torch; print(torch.cuda.device_count())')"
              echo "Detected GPU_COUNT=${GPU_COUNT}"
              echo "Kubernetes granted (resources.limits.nvidia.com/gpu): EXPECTED_GPU_COUNT=${EXPECTED_GPU_COUNT}"

              if [[ "${GPU_COUNT}" != "${EXPECTED_GPU_COUNT}" ]]; then
                echo "GPU count mismatch: PyTorch sees ${GPU_COUNT} GPU(s), but this" >&2
                echo "Pod was granted ${EXPECTED_GPU_COUNT} via resources.limits.nvidia.com/gpu." >&2
                echo "This should not happen under normal Kubernetes GPU scheduling --" >&2
                echo "stopping rather than launching distributed training with an" >&2
                echo "unexpected device count." >&2
                exit 1
              fi

              stage_done "CUDA and GPU verified (${GPU_COUNT} GPU(s) visible)"

              stage "Training configuration summary"
              echo "Model:                ${MODEL_DIR}"
              echo "Dataset:              ${DATASET_ROOT}"
              echo "Steps:                ${TRAINING_STEPS}"
              echo "Batch size (per GPU): ${BATCH_SIZE}"
              echo "GPUs:                 ${GPU_COUNT}"
              echo "Effective batch size: $(( BATCH_SIZE * GPU_COUNT ))"
              echo "Workers:              ${NUM_WORKERS}"
              echo "RENAME_MAP:           ${RENAME_MAP}"
              echo "Empty cameras:        ${POLICY_EMPTY_CAMERAS}"
              echo "Normalization:        ${NORMALIZATION_MAPPING}"
              echo "Freeze vision encoder: true"
              echo "Train expert only:     true"
              echo "Compile model:         true"
              stage_done "Configuration summary printed"

              stage "Starting fine-tuning"

              # Built as an array (not a single string) so the arguments
              # used here and the ones logged into the metadata file below
              # are guaranteed to be the exact same list, not a
              # hand-reconstructed guess.
              TRAIN_ARGS=(
                --dataset.repo_id="${DATASET_REPO_ID}"
                --dataset.root="${DATASET_ROOT}"
                --policy.path="${MODEL_DIR}"
                --policy.device=cuda
                --policy.empty_cameras="${POLICY_EMPTY_CAMERAS}"
                --policy.compile_model=true
                --policy.gradient_checkpointing=true # experiment
                --policy.dtype=bfloat16              # experiment
                --policy.freeze_vision_encoder=true
                --policy.train_expert_only=true
                --policy.normalization_mapping="${NORMALIZATION_MAPPING}"
                --rename_map="${RENAME_MAP}"
                --output_dir="${RUN_OUTPUT_DIR}"
                --job_name="${RUN_NAME}"
                --steps="${TRAINING_STEPS}"
                --batch_size="${BATCH_SIZE}"
                --num_workers="${NUM_WORKERS}"
                --save_checkpoint_to_hub=false
                --policy.push_to_hub=false
                --wandb.enable=false
              )

              # Deliberately NOT "exec" here: this container needs to run
              # again after training exits, to write the fine-tuned model's
              # metadata file. The "if ...; then/else" form (rather than
              # checking $? afterward) is required under "set -euo
              # pipefail" -- a failing command directly in an if-condition
              # does not trigger -e, whereas checking $? on a separate line
              # after the command would have already exited the script on
              # failure before that line ever ran.
              #
              # Branches on GPU_COUNT (captured earlier from
              # torch.cuda.device_count()) rather than always going through
              # accelerate: LeRobot's own nightly CI
              # (tests/training/test_multi_gpu.py) explicitly skips all
              # multi-GPU/accelerate tests when fewer than 2 GPUs are
              # available -- "accelerate launch" with num_processes=1 is
              # never exercised upstream, so this avoids relying on
              # untested behavior for the single-GPU case.
              if (( GPU_COUNT >= 2 )); then
                echo "GPU_COUNT=${GPU_COUNT} -- launching distributed via accelerate"

                python -c "import accelerate; print('accelerate', accelerate.__version__)"

                # Mirrors _write_multi_gpu_config() in LeRobot's own
                # tests/training/test_multi_gpu.py field-for-field (the
                # exact config their nightly CI validates against), rather
                # than relying on accelerate's undocumented-for-lerobot
                # auto-detect path. Regenerated each run (num_processes
                # depends on GPU_COUNT), written to a scratch location, not
                # the dataset/model PVCs.
                ACCELERATE_CONFIG="/tmp/accelerate_config.yaml"
                cat > "${ACCELERATE_CONFIG}" <<EOF
              compute_environment: LOCAL_MACHINE
              distributed_type: MULTI_GPU
              mixed_precision: 'no'
              num_processes: ${GPU_COUNT}
              use_cpu: false
              gpu_ids: all
              downcast_bf16: 'no'
              machine_rank: 0
              main_training_function: main
              num_machines: 1
              rdzv_backend: static
              same_network: true
              EOF

                LEROBOT_TRAIN_BIN="$(command -v lerobot-train)"
                TRAIN_COMMAND="accelerate launch --config_file ${ACCELERATE_CONFIG} ${LEROBOT_TRAIN_BIN} ${TRAIN_ARGS[*]}"

                if accelerate launch \
                    --config_file "${ACCELERATE_CONFIG}" \
                    "${LEROBOT_TRAIN_BIN}" \
                    "${TRAIN_ARGS[@]}"
                then
                  echo "accelerate launch (${GPU_COUNT} GPUs) completed successfully"
                else
                  TRAIN_EXIT_CODE=$?
                  echo "accelerate launch failed with exit code ${TRAIN_EXIT_CODE}" >&2
                  exit "${TRAIN_EXIT_CODE}"
                fi
              else
                echo "GPU_COUNT=${GPU_COUNT} -- launching lerobot-train directly (no accelerate)"
                TRAIN_COMMAND="lerobot-train ${TRAIN_ARGS[*]}"

                if lerobot-train "${TRAIN_ARGS[@]}"; then
                  echo "lerobot-train completed successfully"
                else
                  TRAIN_EXIT_CODE=$?
                  echo "lerobot-train failed with exit code ${TRAIN_EXIT_CODE}" >&2
                  exit "${TRAIN_EXIT_CODE}"
                fi
              fi

              stage_done "Fine-tuning completed"

              stage "Writing fine-tuned model metadata"

              # RUN_OUTPUT_DIR now exists (lerobot-train created it) and
              # holds the checkpoint(s); the metadata file is written
              # alongside them on pvc-finetuned-models, in the same
              # dated run folder.
              DATASET_ROOT="${DATASET_ROOT}" \
              MODEL_REPO_ID="${MODEL_REPO_ID}" \
              MODEL_DIR="${MODEL_DIR}" \
              DATASET_REPO_ID="${DATASET_REPO_ID}" \
              RUN_ID="${RUN_ID}" \
              RUN_OUTPUT_DIR="${RUN_OUTPUT_DIR}" \
              RENAME_MAP="${RENAME_MAP}" \
              POLICY_EMPTY_CAMERAS="${POLICY_EMPTY_CAMERAS}" \
              GPU_COUNT="${GPU_COUNT}" \
              BATCH_SIZE="${BATCH_SIZE}" \
              TRAIN_COMMAND="${TRAIN_COMMAND}" \
              python - <<'PY'
              import json
              import os
              from datetime import datetime, timezone
              from pathlib import Path

              dataset_root = Path(os.environ["DATASET_ROOT"])
              with (dataset_root / "meta" / "info.json").open() as stream:
                  dataset_info = json.load(stream)

              dataset_format = str(
                  dataset_info.get("codebase_version")
                  or dataset_info.get("version")
                  or dataset_info.get("dataset_version")
                  or "unknown"
              )

              metadata = {
                  "run_id": os.environ["RUN_ID"],
                  "finetuned_at_utc": datetime.now(timezone.utc).isoformat(),
                  "base_model": {
                      "repo_id": os.environ["MODEL_REPO_ID"],
                      "path": os.environ["MODEL_DIR"],
                  },
                  "dataset": {
                      "repo_id": os.environ["DATASET_REPO_ID"],
                      "root": os.environ["DATASET_ROOT"],
                      "format_version": dataset_format,
                  },
                  "rename_map": json.loads(os.environ["RENAME_MAP"]),
                  "policy_empty_cameras": int(os.environ["POLICY_EMPTY_CAMERAS"]),
                  "gpu_count": int(os.environ["GPU_COUNT"]),
                  "batch_size_per_gpu": int(os.environ["BATCH_SIZE"]),
                  "train_command": os.environ["TRAIN_COMMAND"],
              }

              out_path = Path(os.environ["RUN_OUTPUT_DIR"]) / "finetune_metadata.json"
              out_path.write_text(json.dumps(metadata, indent=2))
              print(f"Wrote {out_path}")
              print(json.dumps(metadata, indent=2))
              PY

              stage_done "Metadata written to ${RUN_OUTPUT_DIR}/finetune_metadata.json"

              echo ""
              echo "============================================================"
              echo "Fine-tuned model available at: ${RUN_OUTPUT_DIR}"
              echo "============================================================"

          volumeMounts:
            # IMPORTANT: mounted at the SAME path the download job used
            # (/workspace/models). The model was downloaded there with
            # local_dir=MODEL_DIR directly under this mount point (see
            # download-job.yaml), so the on-disk layout relative to the
            # volume root is "lerobot/pi05_base/...". Mounting this same PVC
            # at a different path here would break MODEL_DIR below. Keep
            # this in sync with download-job.yaml's base-models mountPath.
            - name: base-models
              mountPath: /workspace/models
              readOnly: true

            - name: datasets
              mountPath: /workspace/data
              readOnly: true

            - name: finetuned-models
              mountPath: /workspace/output

            - name: training-cache
              mountPath: /workspace/cache

            - name: dshm
              mountPath: /dev/shm

          # Kubernetes still requires a fixed GPU count declared here for
          # the scheduler up front -- there's no "however many the node
          # has" resource request. That's the one unavoidable manual
          # value. Everything about HOW TRAINING USES those GPUs is no
          # longer decided here, though: the trainer script below always
          # launches via `accelerate launch --multi_gpu` WITHOUT
          # `--num_processes`, and accelerate itself auto-detects the
          # actual GPU count at launch time (torch.cuda.device_count()
          # under the hood) and uses all of them -- confirmed working
          # identically for both single- and multi-GPU cases in HF's own
          # docs, no branching needed on our side.
          #
          # Currently confirmed via `oc get machinesets`: the only live
          # GPU pool in this cluster is gpu-pool-size=xlarge (4x NVIDIA
          # L40S per node, see nodeSelector above) -- so values above 4
          # will never schedule right now.
          resources:
            requests:
              cpu: "32"
              memory: 192Gi
              nvidia.com/gpu: "4"
            limits:
              cpu: "64"
              memory: 384Gi
              nvidia.com/gpu: "4"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true

      volumes:
        - name: base-models
          persistentVolumeClaim:
            claimName: pvc-base-models

        - name: datasets
          persistentVolumeClaim:
            claimName: pvc-datasets

        - name: finetuned-models
          persistentVolumeClaim:
            claimName: pvc-finetuned-models

        - name: training-cache
          emptyDir:
            sizeLimit: 50Gi

        # Default container /dev/shm is ~64Mi, far too small for
        # PyTorch DataLoader workers (num_workers>0) passing image
        # batches between worker and main processes via shared
        # memory -- this caused "unable to allocate shared memory(shm)"
        # RuntimeErrors once real batches started flowing. medium:
        # Memory makes this a tmpfs (real RAM, counted against the
        # trainer container's memory limit below).
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
